
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SediaNiaga AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      padding: 30px 15px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 25px #00000012;
    }

    .header {
      background: #173b69;
      padding: 25px;
      color: white;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: #dce8f7;
    }

    .chatbox {
      height: 450px;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #dceafa;
      margin-left: 20%;
    }

    .bot {
      background: #f0f2f5;
      margin-right: 20%;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background: #173b69;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      padding: 12px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <h1>SediaNiaga AI Assistant</h1>
      <p>From Knowledge to Opportunity</p>
    </div>

    <div class="chatbox" id="chatbox">
      <div class="message bot">
        Hello! Welcome to SediaNiaga AI.
        Ask me a question about the SediaNiaga project.
      </div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="question"
        placeholder="Ask about SediaNiaga..."
        required
      >
      <button type="submit" id="sendButton">
        Send
      </button>
    </form>

    <div class="footer">
      SediaNiaga AI | Gamuda AI Academy Exercise 3
    </div>

  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const chatbox = document.getElementById("chatbox");
    const button = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;

      return message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");

      input.value = "";
      button.disabled = true;

      const loading = addMessage(
        "Searching the SediaNiaga knowledge base...",
        "bot"
      );

      try {
        const url = "/ask?question="
          + encodeURIComponent(question);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            "API returned status " + response.status
          );
        }

        const data = await response.json();

        loading.textContent = data.answer;

      } catch (error) {
        loading.textContent =
          "Unable to get an AI response. " +
          error.message;

      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
